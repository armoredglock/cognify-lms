name: Backend CI (Django, PostgreSQL & Security SAST)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-quality-and-tests:
    name: Backend Lint, Security & Database Integrity
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cognify_lms_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Bandit Security SAST Scan (SQLi & Vulnerability Check)
        run: |
          bandit -r backend/apps backend/services backend/config -ll -i

      - name: Run Flake8 Code Linter
        run: |
          # Stop build on syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Max line length 120
          flake8 backend --count --exit-zero --max-line-length=120 --statistics

      - name: Django System Health Check
        working-directory: ./backend
        env:
          DB_NAME: cognify_lms_ci
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          SECRET_KEY: ci-secret-key-test-environment
          DEBUG: "True"
        run: |
          python manage.py check

      - name: Check for Uncommitted Model Migrations
        working-directory: ./backend
        env:
          DB_NAME: cognify_lms_ci
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          SECRET_KEY: ci-secret-key-test-environment
          DEBUG: "True"
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Apply Live Migrations on PostgreSQL 15
        working-directory: ./backend
        env:
          DB_NAME: cognify_lms_ci
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          SECRET_KEY: ci-secret-key-test-environment
          DEBUG: "True"
        run: |
          python manage.py migrate

      - name: Run Unit Tests with Coverage
        working-directory: ./backend
        env:
          DB_NAME: cognify_lms_ci
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          SECRET_KEY: ci-secret-key-test-environment
          DEBUG: "True"
        run: |
          coverage run manage.py test
          coverage report -m
