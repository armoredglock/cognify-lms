name: PR Traceability & Agile Compliance Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  traceability-validation:
    name: Validate Requirement Traceability & Branch Conventions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Branch Name Convention
        id: branch_check
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Checking branch name: $BRANCH_NAME"
          # Allowed pattern: <owner>/<type>/<short-slug>-LMS-<MODULE>-<NUM> or [no-req]
          if [[ "$BRANCH_NAME" =~ ^[a-zA-Z0-9_-]+\/(feat|fix|docs|refactor|test)\/[a-zA-Z0-9_-]+-LMS-[A-Z]+-[0-9]+$ || "$BRANCH_NAME" =~ ^[a-zA-Z0-9_-]+\/(feat|fix|docs|refactor|test)\/no-req-[a-zA-Z0-9_-]+$ ]]; then
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "✅ Branch naming satisfies Agile convention: $BRANCH_NAME"
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "⚠️ Warning: Branch '$BRANCH_NAME' does not match '<owner>/<type>/<slug>-LMS-<MODULE>-<ID>'."
          fi

      - name: Check PR Body for Requirement ID or Issue Reference
        id: req_check
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          COMBINED="$PR_TITLE $PR_BODY"
          
          echo "Validating PR content for SRS Requirement / Issue linkage..."
          if echo "$COMBINED" | grep -Eq "LMS-[A-Z]+-[0-9]+|#[0-9]+|\[no-req\]"; then
            REQ_ID=$(echo "$COMBINED" | grep -Eo "LMS-[A-Z]+-[0-9]+" | head -n 1 || echo "Issue-Linked")
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "req_id=$REQ_ID" >> $GITHUB_OUTPUT
            echo "✅ Traceability statement detected ($REQ_ID)!"
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "❌ ERROR: No Requirement ID (e.g. LMS-AUTH-01) or [no-req] tag found in PR."
            exit 1
          fi

      - name: Post PR Status Summary Comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchValid = "${{ steps.branch_check.outputs.valid }}" === "true";
            const reqValid = "${{ steps.req_check.outputs.valid }}" === "true";
            const reqId = "${{ steps.req_check.outputs.req_id }}" || "None detected";

            const body = `### 📋 Agile Traceability CI Report
            - **Requirement Traced**: ${reqValid ? `✅ \`${reqId}\`` : '❌ Missing Requirement ID (e.g. `[LMS-AUTH-01]` or `[no-req]`)'}
            - **Branch Naming**: ${branchValid ? '✅ Compliant with `<owner>/<type>/<slug>-<req-id>`' : '⚠️ Non-standard branch name'}
            - **Traceability Matrix**: Refer to [\`docs/TRACEABILITY.md\`](docs/TRACEABILITY.md)

            *Automated gate for DBMS Course Project agile evaluation.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
